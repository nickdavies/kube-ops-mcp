[package]
name = "kube-ops-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", features = ["client", "rustls-tls", "runtime"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
